events {
    worker_connections 1024;
}

http {
    # Базовые настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ===== ЗАЩИТА ОТ DDoS =====
    
    # Rate limiting: не более 10 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    
    # Rate limiting для API: не более 5 запросов в секунду
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    
    # Connection limiting: не более 10 одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Защита от slowloris атак
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    
    # Блокировка подозрительных User-Agent
    map $http_user_agent $bad_bot {
        default 0;
        ~*curl 0;  # curl разрешен для мониторинга
        ~*wget 0;  # wget разрешен
        ~*(bot|crawler|spider|scraper) 1;
        ~*(nikto|sqlmap|nmap|masscan) 1;
    }

    # Перенаправление HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name vibe-wheel.ru www.vibe-wheel.ru;

        # Для получения SSL сертификата (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Перенаправляем все остальное на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name vibe-wheel.ru www.vibe-wheel.ru;

        # SSL сертификаты (будут созданы Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/vibe-wheel.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vibe-wheel.ru/privkey.pem;
        
        # SSL параметры
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # HSTS (опционально, для повышенной безопасности)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Дополнительные заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Блокировка подозрительных ботов
        if ($bad_bot) {
            return 403;
        }

        # Ограничение соединений: не более 10 одновременных с одного IP
        limit_conn addr 10;

        # API endpoints - строгие ограничения
        location /api/ {
            # Rate limiting: 5 запросов в секунду, burst до 10
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Остальные запросы - более мягкие ограничения
        location / {
            # Rate limiting: 10 запросов в секунду, burst до 20
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
